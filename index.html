<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Senja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        
        <div class="logo">Kedai Kopi Senja</div>
        <nav>
            <a href="#beranda">Beranda</a>
            <a href="#menu">Menu</a>
            <a href="#pesanan">Pesanan</a>
            <a href="#kontak">Kontak</a>
        </nav>
    </header>
    <section class="hero" id="Menu">
        <div>
            <span class="garis"></span>  
            <h1>Menu Favorit Kami</h1>
        </div>
    </section>
<section class="menu" id="menu">
        <div class="bg">
            <div class="kartu">
                <div class="icon">KS</div>
                <h3 >Kopi Susu Gula Aren</h3>
                <p>Rp15.000</p>
            </div>
            <div class="kartu">
                <div class="icon">AM</div>
                <h3>Americano</h3>
                <p>Rp13.000</p>
            </div>
            <div class="kartu">
                <div class="icon">RB</div>
                <h3>Roti Bakar Coklat</h3>
                <p>Rp12.000</p>
            </div>
            <div class="kartu">
                <div class="icon">KG</div>
                <h3>Kentang Goreng</h3>
                <p>Rp10.000</p>
            </div>
        </div>
    </section>
    <h1>Form Pemesanan</h1>
    <div class="kartu2">
        <div class="form1">
            <form>
                <label for="Menu">Pilih Menu</label>
                <select name="Menu" id="Menu">
                    <option value="kopisusugulaaren">Kopi Susu Gula Aren</option>
                    <option value="americano">Americano</option>
                    <option value="rotibakar">Roti Bakar</option>
                    <option value="kentanggoreng">Kentang Goreng</option>
                </select><br>
            </form>
        </div>
        <div class="form2">    
                
            <form>
                <label for="Jumlah">Jumlah</label>
                <input type="number" min="1" max="100" id="Jumlah" placeholder="Jumlah">
            </form>
        </div>
        <button type="submit">+ Tambah Ke Keranjang</button>
    </div>
    <section class="Keranjang">
        <h1>Keranjang</h1>
        <div class="kartu3">
            <h3>Total Bayar</h3>
            <h3>Rp0</h3>
        </div>
    </section>
    <footer>
        &copy; Senja Kopi 2026
    </footer>
</body>
</html>
